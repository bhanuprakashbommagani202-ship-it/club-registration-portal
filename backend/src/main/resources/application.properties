spring.application.name=club-portal
server.port=8080

# ---- MySQL --------------------------------------------------------------------
# The database is created automatically on first run (createDatabaseIfNotExist=true).
# Override with environment variables DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/club_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate creates / updates the tables from the entity classes (see database/schema.sql for the result).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- App rules ----------------------------------------------------------------
# A student can have at most this many clubs at once (pending applications count too).
app.max-active-clubs=3

# ---- Security -----------------------------------------------------------------
# CHANGE THIS in production: any random string of 32+ characters.
app.jwt.secret=${JWT_SECRET:club-portal-dev-secret-change-me-0123456789abcdef}
app.jwt.expiration-minutes=1440
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Demo users / clubs / events are inserted when the users table is empty.
app.seed.enabled=true

# Never leak stack traces to clients.
server.error.include-stacktrace=never
server.error.include-message=never
